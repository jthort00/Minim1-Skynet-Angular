<div class="forum">
  <h1 class="forum-title">Forum Posts</h1>
  <div *ngIf="posts && posts.length > 0; else noPosts" class="posts-container">
    <div *ngFor="let post of posts" class="post-card">
      <div class="post-header">
        <h2 class="post-title">{{ post.name }}</h2>
        <small class="post-id">#{{ post.postId }}</small>
      </div>
      <p class="post-comment">{{ post.comment }}</p>
      <div class="post-reactions">
        <h3 class="reactions-title">Reactions:</h3>
        <span class="likes">👍 {{ post.likes || 0 }}</span>
        <span class="dislikes">👎 {{ post.dislikes || 0 }}</span>
      </div>
      <div class="reaction-buttons">
        <button (click)="addReaction(post, 'like')">👍 Like</button>
        <button (click)="addReaction(post, 'dislike')">👎 Dislike</button>
      </div>
    </div>
  </div>
  <ng-template #noPosts>
    <p class="no-posts-message">No posts available. Be the first to share something!</p>
  </ng-template>
</div>
