<div class="forum">
  <h1 class="forum-title">Forum Posts</h1>
  <div *ngIf="posts && posts.length > 0; else noPosts" class="posts-container">
    <div *ngFor="let post of posts" class="post-card">
      <div class="post-header">
        <h2 class="post-title">{{ post.name }}</h2>
        <small class="post-id">#{{ post.id }}</small>
      </div>
      <p class="post-comment">{{ post.comment }}</p>
    </div>
  </div>
  <ng-template #noPosts>
    <p class="no-posts-message">No posts available. Be the first to share something!</p>
  </ng-template>
</div>
